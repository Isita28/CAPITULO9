<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejemplo 9.1 — Función cuadrado</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejemplo 9.1: Función cuadrado</h1><p>Una función recibe un argumento, calcula su cuadrado y devuelve el resultado con <code>return</code>.</p><section><label>Número: <input id="n" type="number" value="6"></label><button onclick="mostrar()">Calcular cuadrado</button><div id="r" class="resultado"></div></section><script>function cuadrado(x){return x*x}function mostrar(){let x=Number(document.getElementById('n').value);document.getElementById('r').textContent='El cuadrado de '+x+' es '+cuadrado(x)+'.'}</script><pre>function cuadrado(x) { return x * x; }</pre></body></html>
