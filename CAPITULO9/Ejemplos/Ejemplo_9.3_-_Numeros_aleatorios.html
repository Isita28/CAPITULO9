<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejemplo 9.3 — Números aleatorios</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejemplo 9.3: Generación de números aleatorios</h1><p><code>Math.random()</code> genera un valor aleatorio que puede escalarse a un entero de 1 a 6.</p><section><button onclick="tirar()">Lanzar dado</button><div id="r" class="resultado">Presiona el botón para lanzar.</div></section><script>function dado(){return Math.floor(Math.random()*6)+1}function tirar(){document.getElementById('r').textContent='Resultado del dado: '+dado()}</script><pre>function dado() { return Math.floor(Math.random() * 6) + 1; }</pre></body></html>
