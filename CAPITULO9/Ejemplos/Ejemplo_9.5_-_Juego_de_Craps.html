<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejemplo 9.5 — Juego de Craps</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejemplo 9.5: Juego de probabilidad (Craps simplificado)</h1><p>Primer tiro: 7 u 11 gana; 2, 3 o 12 pierde. Cualquier otro total se convierte en el punto que debe repetirse antes de sacar 7.</p><section><button onclick="jugar()">Jugar una ronda</button><div id="r" class="resultado"></div></section><script>function dado(){return Math.floor(Math.random()*6)+1}function jugar(){let a=dado(),b=dado(),s=a+b,t='Primer tiro: '+a+' + '+b+' = '+s+'. ';if(s===7||s===11)t+='¡Ganaste!';else if(s===2||s===3||s===12)t+='Perdiste.';else{let punto=s,actual=0,tiros=0;do{actual=dado()+dado();tiros++}while(actual!==punto&&actual!==7&&tiros<100);t+='Punto: '+punto+'. Después de '+tiros+' tiro(s), salió '+actual+'. '+(actual===punto?'¡Ganaste!':actual===7?'Perdiste.':'Se alcanzó el límite de simulación.')}document.getElementById('r').textContent=t}</script></body></html>
