<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejemplo 9.4 — Estadísticas de dados</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejemplo 9.4: Lanzar un dado y mostrar estadísticas</h1><p>Simula lanzamientos y cuenta la frecuencia de cada cara.</p><section><label>Lanzamientos (1 a 10000): <input id="n" type="number" min="1" max="10000" value="100"></label><br><button onclick="simular()">Simular</button><div id="r" class="resultado"></div></section><script>function simular(){let n=Math.max(1,Math.min(10000,Number(document.getElementById('n').value)||1)),c=[0,0,0,0,0,0];for(let i=0;i<n;i++)c[Math.floor(Math.random()*6)]++;document.getElementById('r').innerHTML=c.map((v,i)=>'Cara '+(i+1)+': '+v+' ('+(v/n*100).toFixed(1)+'%)').join('<br>')}</script></body></html>
