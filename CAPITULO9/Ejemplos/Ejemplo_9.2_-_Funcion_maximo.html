<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejemplo 9.2 — Función máximo</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejemplo 9.2: Función máximo</h1><p>La función compara dos valores y devuelve el mayor.</p><section><label>Primer número: <input id="a" type="number" value="12"></label><br><label>Segundo número: <input id="b" type="number" value="8"></label><br><button onclick="calc()">Determinar máximo</button><div id="r" class="resultado"></div></section><script>function maximo(x,y){return x>y?x:y}function calc(){document.getElementById('r').textContent='El mayor es: '+maximo(Number(a.value),Number(b.value))}</script><pre>function maximo(x, y) { return x > y ? x : y; }</pre></body></html>
