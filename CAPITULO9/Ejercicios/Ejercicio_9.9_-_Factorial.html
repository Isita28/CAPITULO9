<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.9: Factorial</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.9: Factorial mediante función</h1><section><label>Entero (0 a 170): <input id="n" type="number" min="0" max="170" value="5"></label><button onclick="calcular()">Calcular</button><div id="r" class="resultado"></div></section><script>function factorial(n){if(n===0)return 1;return n*factorial(n-1)}function calcular(){let n=Number(document.getElementById('n').value);r.textContent=Number.isInteger(n)&&n>=0&&n<=170?n+'! = '+factorial(n):'Introduce un entero entre 0 y 170.'}</script></body></html>
