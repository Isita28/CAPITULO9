<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.21: Lanzamiento de moneda</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.21: Lanzamiento de moneda</h1><section><label>Lanzamientos: <input id="n" type="number" min="1" max="10000" value="100"></label><button onclick="lanzar()">Simular</button><div id="r" class="resultado"></div></section><script>function lanzar(){let n=Math.max(1,Math.min(10000,Number(document.getElementById('n').value)||1)),a=0,s=0;for(let i=0;i<n;i++){if(Math.random()<.5)a++;else s++}r.innerHTML='Águilas: '+a+' ('+(a/n*100).toFixed(1)+'%)<br>Soles: '+s+' ('+(s/n*100).toFixed(1)+'%)'}</script></body></html>
