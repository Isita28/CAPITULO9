<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.18: Mínimo de tres números</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.18: Mínimo de tres números</h1><section><label>A: <input id="a" type="number" step="any" value="5"></label><label>B: <input id="b" type="number" step="any" value="-2"></label><label>C: <input id="c" type="number" step="any" value="7"></label><button onclick="calc()">Buscar mínimo</button><div id="r" class="resultado"></div></section><script>function minimo3(a,b,c){return Math.min(a,b,c)}function calc(){r.textContent='El menor es '+minimo3(Number(a.value),Number(b.value),Number(c.value))}</script></body></html>
