<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.29: Potencia recursiva</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.29: Potencia recursiva</h1><section><label>Base: <input id="b" type="number" step="any" value="3"></label><label>Exponente (0 a 100): <input id="e" type="number" min="0" max="100" value="4"></label><button onclick="calc()">Calcular</button><div id="r" class="resultado"></div></section><script>function potencia(b,e){if(e===0)return 1;return b*potencia(b,e-1)}function calc(){let b=Number(document.getElementById('b').value),e=Number(document.getElementById('e').value);r.textContent=Number.isInteger(e)&&e>=0&&e<=100?'Resultado: '+potencia(b,e):'El exponente debe ser entero de 0 a 100.'}</script></body></html>
