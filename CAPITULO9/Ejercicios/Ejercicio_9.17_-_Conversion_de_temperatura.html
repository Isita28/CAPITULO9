<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.17: Conversión de temperatura</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.17: Conversión de temperatura</h1><section><label>Temperatura: <input id="t" type="number" step="any" value="32"></label><br><button onclick="aCelsius()">Fahrenheit a Celsius</button><button onclick="aFahrenheit()">Celsius a Fahrenheit</button><div id="r" class="resultado"></div></section><script>function Celsius(f){return (5/9)*(f-32)}function fahrenheit(c){return (9/5)*c+32}function aCelsius(){let t=Number(document.getElementById('t').value);r.textContent=t+' °F = '+Celsius(t).toFixed(2)+' °C'}function aFahrenheit(){let t=Number(document.getElementById('t').value);r.textContent=t+' °C = '+fahrenheit(t).toFixed(2)+' °F'}</script></body></html>
