<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.6: Volumen de una esfera</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.6: Volumen de una esfera</h1><p>Calcula el volumen mediante V = (4/3)πr³.</p><section><label>Radio: <input id="radio" type="number" min="0" step="any" value="3"></label><button onclick="calcular()">Calcular volumen</button><div id="r" class="resultado"></div></section><script>function volumenEsfera(r){return (4/3)*Math.PI*Math.pow(r,3)}function calcular(){let v=Number(radio.value);r.textContent=v>0?'Volumen: '+volumenEsfera(v).toFixed(4):'Introduce un radio mayor que cero.'}</script></body></html>
