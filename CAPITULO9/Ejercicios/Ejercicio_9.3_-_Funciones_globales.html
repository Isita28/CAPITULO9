<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.3: Funciones globales</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.3: Funciones globales de JavaScript</h1><p>Prueba <code>isNaN</code>, <code>encodeURIComponent</code> y <code>decodeURIComponent</code>.</p><section><label>Texto: <input id="txt" value="Hola mundo & web"></label><br><label>Valor: <input id="num" value="abc"></label><br><button onclick="probar()">Ejecutar</button><div id="r" class="resultado"></div></section><script>function probar(){let t=txt.value,c=encodeURIComponent(t);r.innerHTML='isNaN(valor): '+isNaN(num.value)+'<br>Codificado: '+c+'<br>Decodificado: '+decodeURIComponent(c)}</script></body></html>
