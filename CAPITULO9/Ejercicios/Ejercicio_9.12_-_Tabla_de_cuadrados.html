<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.12: Tabla de cuadrados</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.12: Tabla de cuadrados</h1><section><label>Desde: <input id="desde" type="number" value="1"></label><label>Hasta: <input id="hasta" type="number" value="10"></label><button onclick="generar()">Generar tabla</button><div id="r" class="resultado"></div></section><script>function cuadrado(n){return n*n}function generar(){let a=Number(desde.value),b=Number(hasta.value);if(!Number.isInteger(a)||!Number.isInteger(b)||b<a||b-a>100){r.textContent='Introduce un intervalo entero válido de hasta 101 valores.';return}let s='<table border="1" cellpadding="6"><tr><th>Número</th><th>Cuadrado</th></tr>';for(let i=a;i<=b;i++)s+='<tr><td>'+i+'</td><td>'+cuadrado(i)+'</td></tr>';r.innerHTML=s+'</table>'}</script></body></html>
