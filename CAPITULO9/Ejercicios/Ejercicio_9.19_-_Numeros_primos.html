<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.19: Números primos</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.19: Números primos</h1><p>Comprueba divisores hasta la raíz cuadrada del número.</p><section><label>Entero: <input id="n" type="number" min="0" value="29"></label><button onclick="probar()">Comprobar</button><div id="r" class="resultado"></div></section><script>function esPrimo(n){if(n<2)return false;for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0)return false;return true}function probar(){let n=Number(document.getElementById('n').value);r.textContent=Number.isInteger(n)?n+(esPrimo(n)?' es primo.':' no es primo.'):'Introduce un entero.'}</script></body></html>
