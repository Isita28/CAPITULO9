<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.20: Puntos de calidad</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.20: Puntos de calidad</h1><p>Convierte un promedio entre 0 y 100 a puntos de calidad de 0 a 4.</p><section><label>Promedio: <input id="p" type="number" min="0" max="100" value="87"></label><button onclick="calcular()">Obtener puntos</button><div id="r" class="resultado"></div></section><script>function puntosCalidad(p){if(p>=90)return 4;if(p>=80)return 3;if(p>=70)return 2;if(p>=60)return 1;return 0}function calcular(){let p=Number(document.getElementById('p').value);r.textContent=p>=0&&p<=100?'Puntos de calidad: '+puntosCalidad(p):'El promedio debe estar entre 0 y 100.'}</script></body></html>
