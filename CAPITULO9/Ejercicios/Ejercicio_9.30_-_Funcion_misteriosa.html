<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.30: Función misteriosa</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.30: ¿Qué hace la función misteriosa?</h1><p>La función suma <code>a</code> consigo misma <code>b</code> veces; equivale a calcular a × b para b entero positivo.</p><section><label>a: <input id="a" type="number" value="4"></label><label>b (1 a 100): <input id="b" type="number" min="1" max="100" value="3"></label><button onclick="calc()">Evaluar</button><div id="r" class="resultado"></div></section><script>function misterio(a,b){if(b===1)return a;return a+misterio(a,b-1)}function calc(){let a=Number(document.getElementById('a').value),b=Number(document.getElementById('b').value);r.textContent=Number.isInteger(b)&&b>=1&&b<=100?'misterio('+a+', '+b+') = '+misterio(a,b):'b debe ser entero de 1 a 100.'}</script></body></html>
