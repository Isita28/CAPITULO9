<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 9.4: Alcance de variables</title><style>body{font-family:Arial,sans-serif;font-size:16px;line-height:1.5;max-width:950px;margin:30px auto;padding:0 18px;color:#222}h1,h2{color:#17365d}section{border:1px solid #ccc;border-radius:8px;padding:16px;margin:18px 0}button{padding:8px 14px;cursor:pointer;margin:5px 0}input{padding:7px;margin:5px;max-width:95%}pre,.resultado{background:#f3f3f3;padding:12px;overflow-x:auto}.resultado{border-left:4px solid #17365d;margin-top:12px}</style></head><body><p><a href="../Menu_Principal.html">← Volver al menú principal</a></p><h1>Ejercicio 9.4: Alcance de variables</h1><p>Los parámetros y variables locales existen dentro del ámbito de la función.</p><section><label>Valor: <input id="v" type="number" value="5"></label><button onclick="probar()">Ejecutar</button><div id="r" class="resultado"></div></section><script>function duplicar(valor){let local=valor*2;return local}function probar(){let v=Number(document.getElementById('v').value);document.getElementById('r').textContent='Duplicar '+v+': '+duplicar(v)+'. La variable local solo existe dentro de la función.'}</script></body></html>
